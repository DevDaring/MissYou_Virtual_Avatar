# Language routing (brief 3.7). Verified 2026-10-15 (docs/PROVIDERS.md).
# Voicebox lists no Bengali, so Bengali cloning routes to Sarvam /voices/clone.
ui_languages:
  - {code: en, label: English}
  - {code: bn, label: বাংলা}
  - {code: hi, label: हिन्दी}

stt_chain:          # informational: Sarvam saaras:v4 (≤30 s sync) → OpenAI gpt-4o-mini-transcribe
  en: [sarvam, openai]
  bn: [sarvam, openai]
  hi: [sarvam, openai]

clone_chain:        # engines tried, in order, when building a cloned voice
  en: [fish, voicebox, sarvam_clone]   # Fish ~0.3–0.8 s/sentence; Voicebox LuxTTS ~3 s on CPU
  hi: [fish, sarvam_clone, voicebox]   # chatterbox hi ≈ 27 s/sentence on CPU — too slow for live calls
  bn: [sarvam_clone]                   # Bengali stays on Sarvam (owner's choice; best native Bengali)

tts_chain:          # fallbacks after the profile's own engine
  en: [sarvam_clone, sarvam, openai, xai]
  hi: [sarvam_clone, sarvam, openai, xai]
  bn: [sarvam_clone, sarvam, xai, openai]

engines:
  fish: {languages: [en, hi]}
  voicebox: {languages: [en, hi]}
  sarvam_clone: {languages: [en, hi, bn]}
  sarvam: {languages: [en, hi, bn]}
  openai: {languages: [en, hi, bn]}
  xai: {languages: [en, hi, bn]}

default_presets:
  sarvam:
    any: {f: roopa, m: rehan}
    en: {f: kavitha, m: aditya}
    bn: {f: roopa, m: rehan}
    hi: {f: priya, m: rahul}
  openai:
    any: {f: coral, m: ash}
  xai:
    any: {f: eve, m: rex}
