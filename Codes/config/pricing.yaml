# Miss You pricing — EDIT ME. Owner-set values (brief 4.4 / 10).
# Provider unit prices in USD, verified 2026-10-15 from provider pricing pages
# (sources in docs/PROVIDERS.md). `unverified: true` marks an estimate; usage
# rows priced from it are flagged "price unknown" in the admin dashboard.
# Where a provider returns the exact bill (xAI cost_in_usd_ticks) the bill wins.
# Units: input_mtok/output_mtok = per 1M tokens; minutes; chars; images; seconds.

providers:
  openai:
    gpt-5.4: {input_mtok: 2.50, output_mtok: 15.00}     # standard tier, pricing page 2026-10-15
    gpt-5.5: {input_mtok: 5.00, output_mtok: 30.00}
    gpt-4.1-mini: {input_mtok: 0.40, output_mtok: 1.60}
    gpt-4o-mini: {input_mtok: 0.15, output_mtok: 0.60}
    gpt-4o-mini-transcribe: {minutes: 0.003}
    openai: {chars: 0.000015, unverified: true}   # gpt-4o-mini-tts: billed per audio token; ~$0.015/min estimate
  openai-4.1:
    gpt-4.1: {input_mtok: 2.00, output_mtok: 8.00}
  linkapi:
    default: {input_mtok: 0.40, output_mtok: 1.60, unverified: true}   # relay price unknown; TLS was failing at build
  linkapi-gemini:
    default: {input_mtok: 0.30, output_mtok: 2.50, unverified: true}
  openrouter:
    openai/gpt-4.1-mini: {input_mtok: 0.40, output_mtok: 1.60}
  gemini:
    gemini-2.5-flash: {input_mtok: 0.30, output_mtok: 2.50}
  deepseek:
    default: {input_mtok: 0.30, output_mtok: 1.20}
  anthropic:
    default: {input_mtok: 1.00, output_mtok: 5.00, unverified: true}
  sarvam:
    saaras:v4: {minutes: 0.0057}          # ₹30/hour at ₹88/USD
    sarvam: {chars: 0.000034}             # bulbul:v3 ₹30 per 10k chars
    sarvam_clone: {chars: 0.000034, unverified: true}   # docs say ₹20–30 per 10k chars
  xai:
    grok-imagine-image-2.0: {images: 0.07}            # medium, 1k; edits also bill the input image
    grok-imagine-video-1.5-lite: {seconds: 0.02}
    grok-imagine-video: {seconds: 0.05}
    xai: {chars: 0.000015}                            # TTS $15 / 1M chars
  voicebox:
    default: {chars: 0.0}                             # local, CPU
  fish:
    fish: {chars: 0.000015}                           # s2.1-pro $15 / 1M UTF-8 bytes (Latin ≈ 1 byte/char)
  fal:
    fal-ai/sync-lipsync/v2: {seconds: 0.05}           # $3.00 / min
    fal-ai/latentsync: {seconds: 0.01}                # $0.60 / min                             # local, CPU

unknown_price_fallback_usd: {tokens: 0.000002, chars: 0.00003, minutes: 0.006, images: 0.08, seconds: 0.08}

# Credits charged to users (PROPOSED defaults — see docs/PRICING_NOTES.md).
credits:
  voice_clone: 20
  scene_generation: 60
  call_minute: 5
  interview_minute: 2
  letter: 15

packs:
  - {id: small, credits: 200, inr: 199, label: "200 credits"}
  - {id: medium, credits: 600, inr: 499, label: "600 credits"}
  - {id: large, credits: 1500, inr: 1099, label: "1500 credits"}
