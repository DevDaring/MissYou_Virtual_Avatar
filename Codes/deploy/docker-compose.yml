# One `docker compose -f deploy/docker-compose.yml --env-file .env --env-file missyou.env up --build`
# brings up the full stack. Voicebox runs as an internal-only service (no published port).
# Note: the production host currently runs natively (see docs/DEPLOY.md); this file is for fresh VPS / local use.
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: missyou, POSTGRES_PASSWORD: "${DB_PASSWORD:-missyou}", POSTGRES_DB: missyou }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api: &api
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    env_file: [../.env, ../missyou.env]
    environment:
      MISSYOU_DATABASE_URL: postgresql+asyncpg://missyou:${DB_PASSWORD:-missyou}@db:5432/missyou
      MISSYOU_REDIS_URL: redis://redis:6379/7
      MISSYOU_STORAGE_DIR: /data
      VOICEBOX_URL: http://voicebox:17493
    volumes: [media:/data]
    depends_on: [db, redis]
  worker-cpu:
    <<: *api
    command: ["arq", "app.worker.WorkerSettings"]
    environment: { MISSYOU_QUEUE: cpu, MISSYOU_DATABASE_URL: "postgresql+asyncpg://missyou:${DB_PASSWORD:-missyou}@db:5432/missyou", MISSYOU_REDIS_URL: "redis://redis:6379/7", MISSYOU_STORAGE_DIR: /data, VOICEBOX_URL: "http://voicebox:17493" }
  worker-gpu:
    <<: *api
    command: ["arq", "app.worker.WorkerSettings"]
    environment: { MISSYOU_QUEUE: gpu, MISSYOU_DATABASE_URL: "postgresql+asyncpg://missyou:${DB_PASSWORD:-missyou}@db:5432/missyou", MISSYOU_REDIS_URL: "redis://redis:6379/7", MISSYOU_STORAGE_DIR: /data, VOICEBOX_URL: "http://voicebox:17493" }
  voicebox:
    build: { context: ../vendor/voicebox }   # upstream Dockerfile; internal network only
    profiles: [voice]
    expose: ["17493"]
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    environment: { DOMAIN: "${DOMAIN:-localhost}" }
    ports: ["80:80", "443:443"]
    depends_on: [api]
volumes: { pgdata: {}, media: {} }
